<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpaceX 发射记录</title>
</head>
<body>
  <header>
    <h1 id="title">SpaceX 发射记录</h1>
    <button id="language" type="button">English</button>
    <p id="source"></p>
    <p id="sync"></p>
  </header>
  <main>
    <label for="vehicle" id="vehicle-label">飞行器</label>
    <select id="vehicle">
      <option value="all">全部</option><option value="Falcon 9">Falcon 9</option>
      <option value="Falcon Heavy">Falcon Heavy</option><option value="Starship">Starship</option>
    </select>
    <h2 id="upcoming-heading">未来发射</h2><div id="upcoming"></div>
    <h2 id="completed-heading">历史发射</h2><div id="completed"></div>
  </main>
  <script>
    const text = {
      zh: { title:'SpaceX 发射记录', source:'数据来源：SpaceX 官网发射页面', synced:'上次官网同步：', next:'下次计划同步：', schedule:'（GitHub Actions 定时任务可能延迟）', vehicle:'飞行器', all:'全部', upcoming:'未来发射', completed:'历史发射', empty:'暂无符合条件的发射记录', mission:'任务', rocket:'飞行器', site:'发射场', landing:'回收地点', date:'发射时间', countdown:'发射倒计时', timePending:'官网尚未公布精确时间', english:'English' },
      en: { title:'SpaceX Launches', source:'Source: SpaceX official launches page', synced:'Last official sync: ', next:'Next scheduled sync: ', schedule:'(GitHub Actions schedules can be delayed)', vehicle:'Vehicle', all:'All', upcoming:'Upcoming launches', completed:'Completed launches', empty:'No launches match this filter.', mission:'Mission', rocket:'Vehicle', site:'Launch site', landing:'Landing site', date:'Launch time', countdown:'Countdown', timePending:'SpaceX has not published an exact launch time.', english:'中文' }
    };
    const zh = { 'Falcon 9':'猎鹰 9 号', 'Falcon Heavy':'猎鹰重型', Starship:'星舰', 'SLC-4E, California':'加利福尼亚州 SLC-4E', 'SLC-40, Florida':'佛罗里达州 SLC-40', 'LC-39A, Florida':'佛罗里达州 LC-39A', Droneship:'无人船', 'Landing Zone':'着陆区', 'Pad 2, Starbase':'星港 2 号发射台', Expended:'不回收' };
    let language = localStorage.getItem('spacex-language') || 'zh', launches = { updatedAt:null, upcoming:[], completed:[] };
    const $ = id => document.getElementById(id), t = key => text[language][key];
    const show = value => language === 'zh' ? (zh[value] || value) : value;
    function nextSync() { const d = new Date(); d.setUTCSeconds(0, 0); d.setUTCMinutes(Math.floor(d.getUTCMinutes() / 15) * 15 + 15); return d; }
    function formatDate(row) {
      if (row.launchTime) return new Intl.DateTimeFormat(language === 'zh' ? 'zh-CN' : 'en-US', { dateStyle:'long', timeStyle:'medium', timeZoneName:'short' }).format(new Date(row.launchTime));
      if (!row.launchDate) return t('timePending');
      const d = new Date(row.launchDate);
      return Number.isNaN(d) ? row.launchDate : new Intl.DateTimeFormat(language === 'zh' ? 'zh-CN' : 'en-US', { dateStyle:'long', timeZone:'UTC' }).format(d);
    }
    function countdown(row) {
      if (!row.launchTime) return t('timePending');
      const seconds = Math.max(0, Math.floor((new Date(row.launchTime) - Date.now()) / 1000));
      const day = Math.floor(seconds / 86400), hour = Math.floor(seconds % 86400 / 3600), min = Math.floor(seconds % 3600 / 60), sec = seconds % 60;
      return language === 'zh' ? `${day} 天 ${hour} 时 ${min} 分 ${sec} 秒` : `${day}d ${hour}h ${min}m ${sec}s`;
    }
    function rows(list) { const filter = $('vehicle').value; return filter === 'all' ? list : list.filter(item => item.vehicle === filter); }
    function renderRows(target, list, future) {
      const data = rows(list); if (!data.length) { target.textContent = t('empty'); return; }
      const table = document.createElement('table'), head = document.createElement('tr');
      [t('mission'), t('rocket'), t('site'), t('landing'), t('date'), future ? t('countdown') : null].filter(Boolean).forEach(label => { const th = document.createElement('th'); th.textContent = label; head.append(th); }); table.append(head);
      data.forEach(row => { const tr = document.createElement('tr'); [show(row.mission), show(row.vehicle), show(row.launchSite), show(row.landingSite), formatDate(row), future ? countdown(row) : null].filter(value => value !== null).forEach(value => { const td = document.createElement('td'); td.textContent = value; tr.append(td); }); table.append(tr); }); target.replaceChildren(table);
    }
    function render() {
      document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en'; document.title = t('title');
      $('title').textContent = t('title'); $('language').textContent = t('english'); $('source').textContent = t('source'); $('vehicle-label').textContent = t('vehicle'); $('vehicle').options[0].textContent = t('all');
      $('upcoming-heading').textContent = t('upcoming'); $('completed-heading').textContent = t('completed');
      const locale = language === 'zh' ? 'zh-CN' : 'en-US', updated = launches.updatedAt ? new Date(launches.updatedAt).toLocaleString(locale) : '—';
      $('sync').textContent = `${t('synced')}${updated} · ${t('next')}${nextSync().toLocaleString(locale)} ${t('schedule')}`;
      renderRows($('upcoming'), launches.upcoming, true); renderRows($('completed'), launches.completed, false);
    }
    $('language').addEventListener('click', () => { language = language === 'zh' ? 'en' : 'zh'; localStorage.setItem('spacex-language', language); render(); }); $('vehicle').addEventListener('change', render);
    fetch('./data/launches.json', { cache:'no-store' }).then(response => response.json()).then(data => { launches = data; render(); }).catch(() => { $('sync').textContent = language === 'zh' ? '同步数据暂时不可用。' : 'Synced data is temporarily unavailable.'; });
    render(); setInterval(render, 1000);
  </script>
</body>
</html>
